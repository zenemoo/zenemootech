name = "zenemoo-url-shortener"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "c3e84d8a84eaa06c632f189765eaa9c6"

# Workers KV Namespace for High-Speed Short Link Lookups
# Create namespace using: npx wrangler kv:namespace create SHORTENER_KV
workers_dev = true
routes = [
  { pattern = "zenemoo.in/l/*", zone_name = "zenemoo.in" },
  { pattern = "www.zenemoo.in/l/*", zone_name = "zenemoo.in" }
]

[[kv_namespaces]]
binding = "SHORTENER_KV"
id = "5b10e3a032264e80a2956869dcdf2695"

[vars]
PRODUCTION_DOMAIN = "https://zenemoo.in"
CORS_ORIGIN = "https://zenemoo.in,https://www.zenemoo.in,https://web.zenemoo.in,http://localhost:5173,http://localhost:3000,http://localhost:5000"
ENABLE_CLICK_TRACKING = "true"
JWT_SECRET = "zenemoo_super_secret_jwt_key_2026"
